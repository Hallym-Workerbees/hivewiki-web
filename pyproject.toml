[project]
name = "hivewiki-web"
version = "0.1.0"
description = "Web application for the HiveWiki project built with Django"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bleach>=6.2.0,<7.0",
    "django>=5.2.13,<6.0",
    "django-environ>=0.13.0",
    "django-htmx>=1.27.0",
    "markdown>=3.9,<4.0",
    "pymdown-extensions>=10.16.0,<11.0",
    "pygments>=2.19.0,<3.0",
    "tinycss2>=1.4.0,<2.0",
    "django-redis>=6.0.0",
    "django-tailwind>=4.4.2",
    "psycopg[binary]>=3.3.3",
    "prometheus-client>=0.23.1,<1.0",
    "uvicorn>=0.42.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
