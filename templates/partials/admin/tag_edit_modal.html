<div class="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/45 px-4 py-8"
     data-admin-modal>
    <div class="absolute inset-0"
         data-admin-modal-close
         onclick="document.getElementById('admin-modal-root').innerHTML = ''"></div>
    <div class="relative z-10 w-full max-w-2xl rounded-[2rem] bg-white p-6 shadow-ambient lg:p-8">
        <div class="flex items-start justify-between gap-4">
            <div>
                <div class="text-sm font-semibold text-primary">Tag Edit</div>
                <h2 class="mt-2 font-headline text-3xl font-extrabold tracking-tight">{{ tag.name }} 수정</h2>
            </div>
            <button type="button"
                    data-admin-modal-close
                    onclick="document.getElementById('admin-modal-root').innerHTML = ''"
                    class="rounded-2xl bg-surface-container-low px-4 py-2 text-sm font-semibold text-on-surface-variant">
                닫기
            </button>
        </div>
        <p class="mt-4 text-sm leading-7 text-on-surface-variant">
            기존 태그의 이름, 슬러그, 유형을 수정합니다. 사용자 태그와 시스템 태그 사이를 자유롭게 전환할 수 있습니다.
        </p>
        <form method="post"
              hx-post="{% url 'admin_tag_edit_modal' tag.id %}"
              hx-target="#admin-modal-root"
              hx-swap="innerHTML"
              class="mt-6 space-y-5">
            {% csrf_token %}
            {% include "partials/form_errors.html" with form=tag_form %}
            {% for field in tag_form %}
                {% include "partials/auth_field.html" %}
            {% endfor %}
            <button type="submit"
                    class="w-full rounded-2xl bg-primary-container px-4 py-3 text-sm font-bold text-on-primary-container">
                변경 저장
            </button>
        </form>
    </div>
</div>
