{% if current_user %}
    <form method="post"
          action="{% url 'community_post_bookmark_toggle' post.id %}"
          {% if htmx_enabled %}hx-post="{% url 'community_post_bookmark_toggle' post.id %}" hx-target="this" hx-swap="outerHTML"{% endif %}>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit"
                class="inline-flex min-w-[6.5rem] items-center justify-center gap-2 rounded-full px-4 py-2 text-sm font-semibold {% if post.is_bookmarked_by_current_user %}bg-amber-100 text-amber-700{% else %}bg-surface-container-high text-on-surface{% endif %}">
            <span class="inline-flex w-4 justify-center">
                <svg class="h-4 w-4"
                     viewBox="0 0 24 24"
                     fill="{% if post.is_bookmarked_by_current_user %}currentColor{% else %}none{% endif %}"
                     stroke="currentColor"
                     stroke-width="1.9"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M6 4.5h12a1.5 1.5 0 0 1 1.5 1.5v13l-7.5-4-7.5 4V6A1.5 1.5 0 0 1 6 4.5Z" />
                </svg>
            </span>
            <span>북마크</span>
        </button>
    </form>
{% else %}
    <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}"
       class="inline-flex min-w-[6.5rem] items-center justify-center gap-2 rounded-full bg-surface-container-high px-4 py-2 text-sm font-semibold text-on-surface">
        <span class="inline-flex w-4 justify-center">
            <svg class="h-4 w-4"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.9"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M6 4.5h12a1.5 1.5 0 0 1 1.5 1.5v13l-7.5-4-7.5 4V6A1.5 1.5 0 0 1 6 4.5Z" />
            </svg>
        </span>
        <span>북마크</span>
    </a>
{% endif %}
