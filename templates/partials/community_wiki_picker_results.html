<div class="space-y-3">
    {% if wiki_results %}
        {% for wiki_document in wiki_results %}
            <div class="flex items-start justify-between gap-3 rounded-[1.25rem] border px-4 py-4 transition {% if wiki_document.pk|stringformat:'s' in selected_wiki_document_ids %}border-primary/20 bg-primary-container/40{% else %}border-transparent bg-white hover:border-primary/15 hover:bg-surface{% endif %}"
                 data-community-wiki-result
                 data-wiki-id="{{ wiki_document.pk }}">
                <div class="min-w-0 flex-1"
                     data-wiki-id="{{ wiki_document.pk }}"
                     data-wiki-title="{{ wiki_document.title }}"
                     data-wiki-summary="{{ wiki_document.summary }}">
                    <span class="block text-sm font-semibold text-on-surface">{{ wiki_document.title }}</span>
                    <span class="mt-1 block line-clamp-2 text-xs leading-6 text-on-surface-variant">{{ wiki_document.summary }}</span>
                </div>
                <div class="ml-3 flex shrink-0 items-center gap-2">
                    <a href="{% url 'wiki_detail' wiki_document.slug %}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant transition hover:bg-surface-container-highest hover:text-on-surface"
                       aria-label="{{ wiki_document.title }} 새 탭에서 열기">
                        <svg class="h-4 w-4"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <path d="M14 4h6v6" />
                            <path d="m10 14 10-10" />
                            <path d="M20 14v6H4V4h6" />
                        </svg>
                        <span class="sr-only">새 탭에서 열기</span>
                    </a>
                    <button type="button"
                            class="rounded-full px-3 py-1 text-[11px] font-semibold {% if wiki_document.pk|stringformat:'s' in locked_wiki_document_ids %}bg-surface-container-high text-on-surface-variant{% elif wiki_document.pk|stringformat:'s' in selected_wiki_document_ids %}bg-red-100 text-red-700{% else %}bg-surface-container-high text-primary{% endif %}"
                            data-community-wiki-option
                            data-wiki-id="{{ wiki_document.pk }}"
                            data-wiki-title="{{ wiki_document.title }}"
                            data-wiki-summary="{{ wiki_document.summary }}"
                            data-community-wiki-option-label
                            {% if wiki_document.pk|stringformat:'s' in locked_wiki_document_ids %}disabled{% endif %}
                            data-community-wiki-action>
                        {% if wiki_document.pk|stringformat:"s" in locked_wiki_document_ids %}
                            기본 참조
                        {% elif wiki_document.pk|stringformat:"s" in selected_wiki_document_ids %}
                            제거
                        {% else %}
                            추가
                        {% endif %}
                    </button>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p class="rounded-[1.25rem] bg-white px-4 py-4 text-sm leading-7 text-on-surface-variant">
            검색 결과가 없습니다. 다른 키워드로 다시 찾아보세요.
        </p>
    {% endif %}
</div>
