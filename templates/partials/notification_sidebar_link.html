{% url 'mypage_notifications' as mypage_notifications_url %}
<a id="{% if sidebar_mode == 'mobile' %}notification-link-sidebar-mobile{% else %}notification-link-sidebar{% endif %}"
   href="{% url 'mypage_notifications' %}"
   class="flex items-center justify-between rounded-2xl px-4 py-3 transition {% if request.path == mypage_notifications_url %}bg-surface-container-high font-bold text-primary{% else %}text-on-surface-variant hover:bg-surface-container-high{% endif %}"
   {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    <span class="inline-flex items-center gap-2">
        <svg class="h-4 w-4"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
            <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
            <path d="M10 17a2 2 0 0 0 4 0" />
        </svg>
        <span>알림</span>
    </span>
    {% if notification_unread_count %}
        <span class="rounded-full bg-primary-container px-2 py-0.5 text-xs font-bold text-on-primary-container">{{ notification_unread_count }}</span>
    {% endif %}
</a>
