<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0">
        {% if eyebrow %}
            <div class="text-xs font-semibold uppercase tracking-[0.24em] text-stone-400">{{ eyebrow }}</div>
        {% endif %}
        <h2 class="mt-2 font-headline text-3xl font-black tracking-tight">{{ title }}</h2>
        {% if description %}
            <p class="mt-3 max-w-2xl text-sm leading-7 text-on-surface-variant">{{ description }}</p>
        {% endif %}
    </div>
    <div class="flex shrink-0 items-center gap-3 self-start">
        {% if refresh_url and refresh_section and refresh_target %}
            <button type="button"
                    hx-get="{{ refresh_url }}{% if refresh_query %}?{{ refresh_query }}&{% else %}?section={{ refresh_section }}{% endif %}{% if refresh_query %}section={{ refresh_section }}{% endif %}"
                    hx-target="{{ refresh_target }}"
                    hx-swap="outerHTML swap:240ms"
                    data-admin-refresh-button
                    onclick="window.startAdminRefreshAnimation?.(this)"
                    aria-label="섹션 새로고침"
                    title="새로고침"
                    class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-surface-container-high text-on-surface-variant transition hover:bg-surface-container-highest">
                <span class="sr-only">새로고침</span>
                <span class="relative inline-flex h-5 w-5 items-center justify-center">
                    <svg class="h-5 w-5 transition-opacity duration-150"
                         data-admin-refresh-icon-static
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                        <path d="M21 3v6h-6" />
                    </svg>
                    <svg class="absolute inset-0 h-5 w-5 opacity-0 transition-opacity duration-150"
                         data-admin-refresh-icon-spinner
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                        <path d="M21 3v6h-6" />
                    </svg>
                </span>
            </button>
        {% endif %}
        {% if href and link_text %}
            <a href="{{ href }}" class="text-sm font-semibold text-primary">{{ link_text }}</a>
        {% endif %}
    </div>
</div>
