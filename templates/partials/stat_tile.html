<article class="rounded-[1.5rem] bg-surface-container-lowest p-5 ambient-shadow">
    <div class="text-xs uppercase tracking-[0.22em] text-stone-400">{{ label }}</div>
    <div class="mt-3 font-headline text-3xl font-black tracking-tight {{ value_class|default:'' }}">
        {% if value_datetime %}
            <time datetime="{{ value_datetime|date:'c' }}"
                  data-local-datetime="{{ value_datetime|date:'c' }}"
                  data-local-format="{{ value_format|default:'datetime' }}">{{ value }}</time>
        {% else %}
            {{ value }}
        {% endif %}
    </div>
    <p class="mt-2 text-sm leading-7 text-on-surface-variant">{{ description }}</p>
</article>
