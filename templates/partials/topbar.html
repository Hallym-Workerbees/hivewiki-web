<header class="glass-nav fixed inset-x-0 top-0 z-40 border-b border-white/60 lg:left-72">
    <div class="flex items-center justify-between px-6 py-4 lg:px-10">
        <div>
            <div class="text-xs font-semibold uppercase tracking-[0.22em] text-stone-400">HiveWiki</div>
        </div>
        <div class="flex items-center gap-3 md:gap-4">
            {% if not hide_topbar_search %}
                <div class="hidden md:block">
                    {% include "partials/search_bar.html" with placeholder="위키 문서를 검색하세요" action=search_action|default:"/search/" %}
                </div>
            {% endif %}
            {% if current_user %}
                {% include "partials/notification_topbar_link.html" %}
                <a href="{% url 'mypage' %}"
                   class="rounded-2xl bg-surface-container-low px-4 py-3 text-sm font-semibold text-on-surface-variant">{{ current_user.username }}</a>
            {% endif %}
        </div>
    </div>
</header>
